<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MALDEK | Living Membrane</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #000; cursor: none; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/addons/p5.sound.min.js"></script>
    <script>
    
        let audioCtx = null;
        let masterGainNode = null;
        let audioStarted = false;
        let masterVolume = 0.7;
        let isMuted = false;
        let globalReverb;

        const VOICE_COUNT = 50;
        let voicePool = [];
        let voiceAmplitudes = new Float32Array(VOICE_COUNT);
        let voiceFreqs = new Float32Array(VOICE_COUNT);
        let voiceTargetFreqs = new Float32Array(VOICE_COUNT);

        function initSpatialAudio() {
            try {
                audioCtx = getAudioContext();
                if (!audioCtx) return;
                masterGainNode = audioCtx.createGain();
                masterGainNode.gain.value = 0.6;
                masterGainNode.connect(audioCtx.destination);
                if (audioCtx.listener) {
                    audioCtx.listener.positionX.value = 0;
                    audioCtx.listener.positionY.value = 0;
                    audioCtx.listener.positionZ.value = 0;
                    audioCtx.listener.forwardX.value = 0;
                    audioCtx.listener.forwardY.value = 0;
                    audioCtx.listener.forwardZ.value = -1;
                    audioCtx.listener.upX.value = 0;
                    audioCtx.listener.upY.value = 1;
                    audioCtx.listener.upZ.value = 0;
                }
            } catch(e) { console.warn('Audio init error:', e); }
        }

        function createVoicePanner(idx) {
            if (!audioCtx) return null;
            let panner = audioCtx.createPanner();
            panner.panningModel = 'HRTF';
            panner.distanceModel = 'inverse';
            panner.refDistance = 1.5;
            panner.maxDistance = 40;
            panner.rolloffFactor = 0.7;
            panner.coneInnerAngle = 360;
            panner.coneOuterAngle = 0;
            panner.coneOuterGain = 0;
            let angle = (idx / VOICE_COUNT) * TWO_PI * 2.7;
            panner.positionX.value = Math.cos(angle) * 3;
            panner.positionY.value = Math.sin(angle * 0.6) * 2.5;
            panner.positionZ.value = Math.sin(angle) * 2 + 5;
            if (masterGainNode) panner.connect(masterGainNode);
            else panner.connect(audioCtx.destination);
            return panner;
        }

        function initVoices() {
            globalReverb = new p5.Reverb();
            globalReverb.set(2, 6);
            for (let i = 0; i < VOICE_COUNT; i++) {
                let osc = new p5.Oscillator('sine');
                let freq = random(60, 500);
                osc.freq(freq);
                osc.amp(0);
                osc.disconnect();
                osc.connect(globalReverb);
                let panner = createVoicePanner(i);
                if (panner) {
                    try {
                        if (osc._gainNode) { osc._gainNode.disconnect(); osc._gainNode.connect(panner); }
                        else { osc.disconnect(); osc.connect(panner); }
                    } catch(e) { try { osc.disconnect(); osc.connect(panner); } catch(e2) {} }
                }
                osc.start();
                voicePool.push({ osc, panner, freq });
                voiceFreqs[i] = freq;
                voiceTargetFreqs[i] = freq;
                voiceAmplitudes[i] = random(0.02, 0.05);
                osc.amp(voiceAmplitudes[i] * masterVolume, 1.5);
            }
        }

        function updateVoices(brightnessMap) {
            let time = millis() * 0.001;
            for (let i = 0; i < VOICE_COUNT; i++) {
                let v = voicePool[i];
                if (!v) continue;
                let idx = floor(i / VOICE_COUNT * totalCells);
                let b = brightnessMap[idx % totalCells] || 0.5;
                let targetFreq = 50 + b * 600 + sin(time * 0.15 + i * 0.5) * 80;
                voiceTargetFreqs[i] += (targetFreq - voiceTargetFreqs[i]) * 0.003;
                v.osc.freq(voiceTargetFreqs[i]);
                let targetAmp = (0.015 + b * 0.1) * masterVolume;
                voiceAmplitudes[i] += (targetAmp - voiceAmplitudes[i]) * 0.015;
                v.osc.amp(voiceAmplitudes[i], 0.05);
                if (v.panner) {
                    let x3d = map(b, 0, 1, -8, 8) + sin(time * 0.08 + i) * 0.8;
                    let y3d = map(sin(time * 0.06 + i * 0.7), -1, 1, -5, 5);
                    let z3d = 2 + b * 8 + sin(time * 0.05 + i * 0.4) * 2;
                    try {
                        v.panner.positionX.value = x3d;
                        v.panner.positionY.value = y3d;
                        v.panner.positionZ.value = z3d;
                    } catch(e) {}
                }
            }
        }


        let gridSize = 5;
        let cols, rows;
        let totalCells;
        let cx, cy, bright, phase, state, velX, velY;
        let time = 0;
        let frame = 0;
        let pg;

        function setup() {
            createCanvas(windowWidth, windowHeight);
            pixelDensity(1);
            initSpatialAudio();
            initVoices();

            cols = floor(width / gridSize);
            rows = floor(height / gridSize);
            totalCells = cols * rows;

            cx = new Float32Array(totalCells);
            cy = new Float32Array(totalCells);
            bright = new Float32Array(totalCells);
            phase = new Float32Array(totalCells);
            velX = new Float32Array(totalCells);
            velY = new Float32Array(totalCells);
            state = new Uint8Array(totalCells);

            for (let i = 0; i < totalCells; i++) {
                let x = (i % cols) * gridSize + gridSize/2;
                let y = floor(i / cols) * gridSize + gridSize/2;
                cx[i] = x;
                cy[i] = y;
                bright[i] = random(0.2, 0.8);
                phase[i] = random(TWO_PI);
                state[i] = 0;
            }

            pg = createGraphics(width, height);
            pg.background(0);
            background(0);
            noLoop();
            initUI();
        }

        function draw() {
            if (!audioStarted) return;
            frame++;
            time = millis();

            let waveTime = time * 0.00018;
            let mouseNormX = mouseX / width;
            let mouseNormY = mouseY / height;

            pg.background(0, 12);

     
            for (let i = 0; i < totalCells; i++) {
                let col = i % cols;
                let row = (i / cols) | 0;
                let baseX = col * gridSize + gridSize * 0.5;
                let baseY = row * gridSize + gridSize * 0.5;
                let nx = col / cols;
                let ny = row / rows;

                let w1 = sin(nx * 16 - waveTime * 18 + ny * 10) * 0.5 + 0.5;
                let w2 = cos(ny * 14 - waveTime * 14 + nx * 12) * 0.5 + 0.5;
                let w3 = sin((nx + ny) * 12 - waveTime * 22) * 0.5 + 0.5;
                let w4 = sin(nx * 20 + waveTime * 16 - ny * 8) * 0.5 + 0.5;
                let w5 = cos(nx * 10 - waveTime * 10 + ny * 18) * 0.5 + 0.5;

                let combined = w1 * 0.2 + w2 * 0.2 + w3 * 0.15 + w4 * 0.15 + w5 * 0.1;
                combined = Math.max(0, Math.min(1, combined));

                let dx = nx - mouseNormX;
                let dy = ny - mouseNormY;
                let distM = dx*dx + dy*dy;
                let ripple = 0;
                if (distM < 0.25) {
                    let t = 1 - Math.sqrt(distM) / 0.5;
                    ripple = sin(Math.sqrt(distM) * 60 - time * 0.0025) * t * 0.7;
                }

                let b = combined + ripple * 0.25;
                b = Math.max(0, Math.min(1, b));
                bright[i] += (b - bright[i]) * 0.06;

                let dispScale = 14 + ripple * 6;
                let flowX = sin(nx * 10 + waveTime * 6) * 0.6 + cos(ny * 8 + waveTime * 4) * 0.5 + ripple * 0.8;
                let flowY = cos(ny * 10 + waveTime * 6) * 0.6 + sin(nx * 8 + waveTime * 4) * 0.5 + ripple * 0.8;
                
                let dxCell = flowX * dispScale;
                let dyCell = flowY * dispScale;

                cx[i] += ((baseX + dxCell) - cx[i]) * 0.08;
                cy[i] += ((baseY + dyCell) - cy[i]) * 0.08;

                let br = bright[i];
                let isGreen = (br > 0.7 && (combined > 0.5 || ripple > 0.1));
                if (isGreen) {
                    state[i] = 3;
                } else if (br > 0.5) {
                    state[i] = 2;
                } else if (br > 0.25) {
                    state[i] = 1;
                } else {
                    state[i] = 0;
                }

                phase[i] += 0.03 + flowX * 0.02 + flowY * 0.02 + ripple * 0.04;
            }

        
            pg.noStroke();
            for (let i = 0; i < totalCells; i++) {
                let x = cx[i];
                let y = cy[i];
                let b = bright[i];
                let s = state[i];
                let p = phase[i];

                let size = gridSize * (0.5 + 0.5 * b);
                let rot = sin(p) * 0.12;

                let r, g, bv;
                if (s === 3) {
                    let intensity = Math.min(1, (b - 0.5) * 5);
                    r = 40 + intensity * 80;
                    g = 210 + intensity * 45;
                    bv = 30 + intensity * 60;
                } else if (s === 2) {
                    let w = 210 + 45 * b;
                    r = w; g = w; bv = w;
                } else if (s === 1) {
                    let w = 90 + 130 * b;
                    r = w; g = w; bv = w;
                } else {
                    let w = 15 + 50 * b;
                    r = w; g = w; bv = w;
                }

                pg.fill(r, g, bv);
                pg.push();
                pg.translate(x, y);
                pg.rotate(rot);
                pg.rectMode(CENTER);
                pg.rect(0, 0, size, size);
                pg.pop();

                if (s === 3) {
                    let glow = Math.min(150, (b - 0.5) * 350);
                    pg.noStroke();
                    pg.fill(40, 255, 120, glow * 0.2);
                    pg.ellipse(x, y, size * 4, size * 4);
                    pg.fill(40, 255, 120, glow * 0.08);
                    pg.ellipse(x, y, size * 8, size * 8);
                }
            }

            image(pg, 0, 0);

            updateVoices(bright);

            noFill();
            stroke(255, 255, 255, 25);
            strokeWeight(1);
            rectMode(CENTER);
            rect(mouseX, mouseY, 30, 30);
            stroke(40, 255, 120, 30);
            rect(mouseX, mouseY, 50, 50);
        }

   
        function mousePressed() {
            if (!audioStarted) {
                userStartAudio();
                audioStarted = true;
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                loop();
            }
        }

        function touchStarted() {
            if (!audioStarted) {
                userStartAudio();
                audioStarted = true;
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                loop();
            }
            return false;
        }

        function windowResized() {
            resizeCanvas(windowWidth, windowHeight);
            cols = floor(width / gridSize);
            rows = floor(height / gridSize);
            totalCells = cols * rows;
            cx = new Float32Array(totalCells);
            cy = new Float32Array(totalCells);
            bright = new Float32Array(totalCells);
            phase = new Float32Array(totalCells);
            velX = new Float32Array(totalCells);
            velY = new Float32Array(totalCells);
            state = new Uint8Array(totalCells);
            for (let i = 0; i < totalCells; i++) {
                let x = (i % cols) * gridSize + gridSize/2;
                let y = floor(i / cols) * gridSize + gridSize/2;
                cx[i] = x;
                cy[i] = y;
                bright[i] = random(0.2, 0.8);
                phase[i] = random(TWO_PI);
                state[i] = 0;
            }
            pg = createGraphics(width, height);
            pg.background(0);
        }

       
        function initUI() {
            const binauralBtn = document.createElement('button');
            binauralBtn.id = 'binauralBtn';
            binauralBtn.innerHTML = '🎧';
            binauralBtn.style.cssText = `
                position: fixed; top: 16px; right: 16px; z-index: 999999;
                width: 32px; height: 32px; border: none; border-radius: 50%;
                background: rgba(20,20,20,0.8); color: #888; font-size: 14px;
                cursor: pointer; border: 1px solid rgba(255,255,255,0.05);
            `;
            document.body.appendChild(binauralBtn);

            const ui = document.createElement('div');
            ui.id = 'audioUI';
            ui.style.cssText = `
                position: fixed; bottom: 16px; right: 16px; z-index: 999998;
                display: flex; align-items: center; gap: 6px;
                background: rgba(0,0,0,0.4); padding: 6px 10px;
                border-radius: 16px; border: 1px solid rgba(255,255,255,0.05);
            `;
            ui.innerHTML = `
                <button id="muteBtn" style="width:20px;height:20px;border:none;border-radius:50%;background:rgba(30,30,30,0.8);color:#888;font-size:9px;cursor:pointer;">M</button>
                <input type="range" id="masterSlider" min="0" max="2" step="0.01" value="0.7" style="width:80px;height:2px;appearance:none;background:rgba(255,255,255,0.15);outline:none;">
            `;
            document.body.appendChild(ui);

            const overlay = document.createElement('div');
            overlay.id = 'binauralOverlay';
            overlay.style.cssText = `
                position: fixed; top:0; left:0; width:100%; height:100%;
                background: rgba(0,0,0,0.7); backdrop-filter: blur(4px);
                z-index: 1000000; display: flex; align-items: center; justify-content: center;
                opacity: 0; pointer-events: none; transition: opacity 0.3s ease;
            `;
            overlay.innerHTML = `
                <div style="background:rgba(15,15,15,0.9);border-radius:16px;padding:30px 40px;max-width:320px;width:90%;border:1px solid rgba(255,255,255,0.05);text-align:center;color:#aaa;">
                    <div style="font-size:32px;margin-bottom:8px;">🎧</div>
                    <h2 style="color:#888;font-size:16px;margin:8px 0;font-weight:300;letter-spacing:2px;">3D SPATIAL AUDIO</h2>
                    <p style="font-size:12px;color:#666;line-height:1.6;">HRTF binaural rendering.<br>Use headphones for full experience.</p>
                    <button id="closeBinaural" style="background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.05);color:#888;padding:8px 24px;border-radius:20px;cursor:pointer;font-size:10px;margin-top:12px;">⟡ ok</button>
                </div>
            `;
            document.body.appendChild(overlay);

            const style = document.createElement('style');
            style.innerHTML = `
                #masterSlider::-webkit-slider-thumb { appearance: none; width: 10px; height: 10px; border-radius: 50%; background: #666; cursor: pointer; }
                #binauralOverlay.active { opacity: 1; pointer-events: all; }
            `;
            document.head.appendChild(style);

            const slider = document.getElementById('masterSlider');
            const muteBtn = document.getElementById('muteBtn');
            const binauralBtnEl = document.getElementById('binauralBtn');

            slider.addEventListener('input', e => {
                masterVolume = parseFloat(e.target.value);
                if (masterGainNode) masterGainNode.gain.value = masterVolume * 0.6;
            });

            muteBtn.addEventListener('click', () => {
                isMuted = !isMuted;
                if (isMuted) { muteBtn.innerHTML = 'X'; if (masterGainNode) masterGainNode.gain.value = 0; }
                else { muteBtn.innerHTML = 'M'; if (masterGainNode) masterGainNode.gain.value = masterVolume * 0.6; }
            });

            binauralBtnEl.addEventListener('click', () => overlay.classList.add('active'));
            document.getElementById('closeBinaural').addEventListener('click', () => overlay.classList.remove('active'));
            overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.classList.remove('active'); });
        }

        noLoop();
    </script>
</body>
</html>
